# Analysis window and output location. @TOKENS@ are filled by mm_run.sh.
analysis:
  start_time: '@START_TIME@'
  end_time: '@END_TIME@'
  output_dir: @OUTPUT_DIR@
  output_dir_save: @OUTPUT_DIR_SAVE@
  save:
    paired:
      method: 'netcdf'
      prefix: @SAVE_PREFIX@
      data: 'all'
  debug: True
