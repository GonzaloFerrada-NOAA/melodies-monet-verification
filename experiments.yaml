  color: 'red'
  marker: '.'
  linestyle: '-'
  markersize: 8
  linewidth: 1.5
  # species mapping [name in model] : [key name in melodies-monet]
  species:
    aod550: "aod_550nm"
    pm25: "PM2.5"
    pm10: "P10"
    t2m: "temp"
    td2m: "dew_pt_temp"
    ws: "ws"
    wd: "wdir"
    pp1h: "precip_1hr"
   