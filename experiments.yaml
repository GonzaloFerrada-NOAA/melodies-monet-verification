rrfs-netcdf:
  raw_output_directory: '/scratch4/BMC/acomp/Gonzalo.Ferrada/tmp/stmp/{init?fmt=%Y%m%d%H}/fcst_fv3lam'
  raw_output_filenames: 'dynf{lead?fmt=%3H}.nc phyf{lead?fmt=%3H}.nc'
  raw_output_format: 'netcdf'  # 'grib2' or 'netcdf'
  model_name: 'RRFS-SD' # 'RRFS-SD' 'cheMPAS-Fire' 'FWx-nest' 'HRRR-Smoke' 'MPAS-Aerosols' 'GEFS-Aerosols' 'UFS-Chem'
  model_type: 'hrrr' # 'standard', 'hrrr', 'rrfs', 'ufs', 'wrfchem'
