CMF-netcdf:
  raw_output_directory: '/scratch3/BMC/acomp/Gonzalo.Ferrada/cmf-dev/opsroot/vectorization/stmp/{init?fmt=%Y%m%d}/rrfs_mpassit_{init?fmt=%H}_v2.1.4/det'
  raw_output_filenames: 'mpassit.{valid?fmt=%Y-%m-%d_%H}.00.00.nc'
  raw_output_format: 'netcdf'  # 'grib2' or 'netcdf'
  model_name: 'CMF' # 'RRFS-SD' or 'CMF'
  model_type: 'standard' # 'standard', 'rrfs', 'ufs', 'wrfchem'
  initialization_hr: 0
  simulation_length_hr: 24
  output_interval_hr: 1
  relative_day_to_obs: 0 # 0 if retro run
  # Plot line settings:
  color: 'red'
  marker: '.'
  linestyle: '-'
  markersize: 8
  linewidth: 1.5
  # species mapping [name in aqm file] : [key name in melodies-monet]
  species:
    aod550: "aod_550nm"
    pm25: "PM2.5"
    # pm10: "PM10"
    t2m: "TEMP"
    t2m: "temperature"
    td2m: "dewpoint"
    ws: "windSpeed"
    wd: "windDir"
    pp1h: "precip1Hour"
    vis: "visibility"
    
